<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
            <div class="mx-auto w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-4">
                <i class="fas fa-envelope text-2xl text-blue-600"></i>
            </div>
            <h2 class="text-2xl font-bold">Verify Your Email</h2>
            <p class="text-gray-600 mt-2">
                We've sent a 6-digit OTP to <strong th:text="${email}"></strong>
            </p>
            <p class="text-sm text-gray-500 mt-1">
                Purpose: <strong th:text="${purpose}"></strong>
            </p>
        </div>

        <div th:if="${message}" class="bg-blue-100 text-blue-700 p-3 rounded mb-4" th:text="${message}"></div>
        <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded mb-4" th:text="${error}"></div>

        <form method="post" th:action="@{/students/verify-otp}">
            <input type="hidden" name="email" th:value="${email}"/>
            <input type="hidden" name="purpose" th:value="${purpose}"/>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Enter OTP</label>
                <input type="text" name="otp" maxlength="6"
                       class="w-full px-4 py-3 text-center text-2xl tracking-widest border rounded-lg focus:outline-none focus:border-blue-500"
                       placeholder="------" required pattern="[0-9]{6}">
                <p class="text-sm text-gray-500 mt-2">Enter the 6-digit code sent to your email</p>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
                Verify OTP
            </button>
        </form>

        <div class="mt-6 text-center">
            <form method="post" th:action="@{/students/resend-otp}" class="inline">
                <input type="hidden" name="email" th:value="${email}"/>
                <input type="hidden" name="purpose" th:value="${purpose}"/>
                <button type="submit" class="text-blue-600 hover:text-blue-800 text-sm">
                    Didn't receive OTP? Resend
                </button>
            </form>
        </div>

        <div class="mt-4 text-center">
            <a href="/students/register" class="text-gray-600 text-sm hover:text-gray-800">
                ← Back to Registration
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // Auto-focus OTP input and auto-submit when 6 digits entered
    document.querySelector('input[name="otp"]').addEventListener('input', function(e) {
        if (this.value.length === 6) {
            this.form.submit();
        }
    });
</script>
</body>

</html>
