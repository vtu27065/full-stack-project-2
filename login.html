<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body class="bg-gray-50">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white rounded-xl shadow-lg p-8">
        <div>
            <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-primary/10">
                <i class="fas fa-lock text-2xl text-primary"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Admin Login</h2>
        </div>

        <form class="mt-8 space-y-6" th:action="@{/login}" method="post">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg">Sign In</button>
        </form>
    </div>
</div>

<!-- Add footer here -->
<footer>
    <div th:replace="fragments/footer :: footer"></div>
</footer>

</body>
</html>
