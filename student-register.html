<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
            <div class="mx-auto w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-4">
                <i class="fas fa-user-graduate text-2xl text-blue-600"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-800">Student Registration</h2>
            <p class="text-gray-600 mt-2">Create your account to get started</p>
        </div>

        <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded mb-4" th:text="${error}"></div>
        <div th:if="${success}" class="bg-green-100 text-green-700 p-3 rounded mb-4" th:text="${success}"></div>

        <form method="post" th:action="@{/students/register}" th:object="${student}">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Full Name *</label>
                <input type="text" th:field="*{name}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Email *</label>
                <input type="email" th:field="*{email}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Student ID (10 digits) *</label>
                <input type="text" th:field="*{studentId}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required pattern="[0-9]{10}" maxlength="10">
                <p class="text-sm text-gray-500 mt-1">Enter your 10-digit student ID</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Department *</label>
                <select th:field="*{department}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" required>
                    <option value="">Select Department</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Business">Business</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 mb-2">Phone Number (Optional)</label>
                <input type="tel" th:field="*{phoneNumber}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500" pattern="[0-9]{10}">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Academic Year</label>
                <select th:field="*{academicYear}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Register Now
            </button>
        </form>

        <!-- Login Link - This is what you're missing -->
        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Already have an account?
                <a href="/students/login" class="text-blue-600 hover:text-blue-800 font-semibold">
                    Login here
                </a>
            </p>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
